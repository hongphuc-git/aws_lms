# Định nghĩa các vai trò. ADMIN sẽ được quản lý trong Cognito Groups
enum Role {
  STUDENT
  INSTRUCTOR
  ADMIN
}

# 1. Bảng User chính
type User @model @auth(rules: [
  {allow: owner, operations: [create, read, update]},
  {allow: groups, groups: ["Admin"], operations: [create,read,update,delete]}
]) {
  id: ID!
  username: String!
  email: String!
  role: Role!
  courses: [Course] @hasMany(indexName: "byInstructor", fields: ["id"])
  enrollments: [Enrollment] @hasMany(indexName: "byStudent", fields: ["id"])
  enrollmentRequests: [EnrollmentRequest] @hasMany(indexName: "byStudent", fields: ["id"])
}

# 2. Bảng Khóa học
type Course @model @auth(rules: [
  {allow: private, provider: userPools, operations: [read]}, # ĐÃ SỬA LỖI: private (cho người đã đăng nhập)
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, update, delete, read]},
  {allow: groups, groups: ["Student"], operations: [read]}
]) {
  id: ID!
  title: String!
  deadline: AWSDateTime
  description: String
  instructorID: ID! @index(name: "byInstructor")
  instructor: User @belongsTo(fields: ["instructorID"])
  lectures: [Lecture] @hasMany(indexName: "byCourse", fields: ["id"])
  quizzes: [Quiz] @hasMany(indexName: "byCourse", fields: ["id"])
  enrollments: [Enrollment] @hasMany(indexName: "byCourse", fields: ["id"])
  enrollmentRequests: [EnrollmentRequest] @hasMany(indexName: "byCourse", fields: ["id"])
  notifications: [CourseNotification] @hasMany(indexName: "byCourse", fields: ["id"])
  messages: [Message] @hasMany(indexName: "byCourse", fields: ["id"])
}

# 3. Bảng Bài giảng (File, Video)
type Lecture @model @auth(rules: [
  # Logic phân quyền xem bài giảng cần được custom chi tiết hơn
  # Tạm thời: Instructor/Admin có thể quản lý, Student (owner của Enrollment) có thể đọc
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, update, delete, read]},
  {allow: private, provider: userPools, operations: [read]} # Cho phép user đã đăng nhập đọc
]) {
  id: ID!
  title: String!
  deadline: AWSDateTime
  courseID: ID! @index(name: "byCourse")
  course: Course @belongsTo(fields: ["courseID"])
  # File được lưu trên S3
  file: S3Object @auth(rules: [{allow: groups, groups: ["Instructor", "Admin"], operations: [read, create, update, delete]}, {allow: private, provider: userPools, operations: [read]}])
}

# 4. Bảng Quiz
type Quiz @model @auth(rules: [
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, update, delete, read]},
  {allow: private, provider: userPools, operations: [read]} # Cho phép user đã đăng nhập đọc
]) {
  id: ID!
  title: String!
  courseID: ID! @index(name: "byCourse")
  course: Course @belongsTo(fields: ["courseID"])
  questions: [Question] @hasMany(indexName: "byQuiz", fields: ["id"])
}

# 5. Bảng Câu hỏi
type Question @model @auth(rules: [
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, update, delete, read]},
  {allow: private, provider: userPools, operations: [read]}
]) {
  id: ID!
  quizID: ID! @index(name: "byQuiz")
  quiz: Quiz @belongsTo(fields: ["quizID"])
  text: String!
  options: [String!]!
  correctAnswerIndex: Int @auth(rules: [{allow: groups, groups: ["Instructor", "Admin"]}, {allow: private, provider: userPools, operations: [read]}]) # ĐÃ SỬA LỖI: Bỏ dấu ! Chỉ Admin/Instructor thấy đáp án
}

# 6. Bảng Đăng ký (Kết nối Student và Course)
type Enrollment @model @auth(rules: [
  {allow: owner, ownerField: "studentID", operations: [create, read, update, delete]},
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, read, update, delete]}
]) {
  id: ID!
  studentID: ID! @index(name: "byStudent")
  student: User @belongsTo(fields: ["studentID"])
  courseID: ID! @index(name: "byCourse")
  course: Course @belongsTo(fields: ["courseID"])
}

enum EnrollmentRequestStatus {
  PENDING
  APPROVED
  REJECTED
}

type EnrollmentRequest @model @auth(rules: [
  {allow: owner, ownerField: "studentID", operations: [create, read, delete]},
  {allow: groups, groups: ["Instructor", "Admin"], operations: [read, update, delete]}
]) {
  id: ID!
  courseID: ID! @index(name: "byCourse")
  studentID: ID! @index(name: "byStudent")
  status: EnrollmentRequestStatus!
  message: String
  course: Course @belongsTo(fields: ["courseID"])
  student: User @belongsTo(fields: ["studentID"])
}

# 7. Bảng Nộp bài (Lưu điểm)
type Submission @model @auth(rules: [
  {allow: owner, ownerField: "studentID"},
  {allow: groups, groups: ["Instructor"], operations: [read]}
]) {
  id: ID!
  studentID: ID! @index(name: "byStudent")
  quizID: ID!
  score: Int!
  answers: [Int!]!
}

# Kiểu S3Object để Amplify tự động liên kết với S3
type S3Object {
  bucket: String!
  region: String!
  key: String!
}
enum MessageStatus {
  UNREAD
  READ
}

type CourseNotification @model @auth(rules: [
  {allow: groups, groups: ["Instructor", "Admin"], operations: [create, update, delete, read]},
  {allow: private, provider: userPools, operations: [read]}
]) {
  id: ID!
  courseID: ID! @index(name: "byCourse")
  course: Course @belongsTo(fields: ["courseID"])
  title: String!
  content: String!
  creatorID: ID!
  creatorName: String
}

type Message @model @auth(rules: [
  {allow: owner, ownerField: "senderID", operations: [create, read, delete]},
  {allow: owner, ownerField: "recipientID", operations: [read, update]},
  {allow: groups, groups: ["Admin"], operations: [read, update, delete]}
]) {
  id: ID!
  senderID: ID! @index(name: "bySender")
  recipientID: ID! @index(name: "byRecipient")
  subject: String
  body: String!
  status: MessageStatus!
  courseID: ID @index(name: "byCourse")
  senderName: String
  recipientName: String
  course: Course @belongsTo(fields: ["courseID"])
}




