version: 1
applications:
  - appRoot: lms-app   # 👈 đổi thành thư mục chứa package.json của app nếu khác
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 18
            - nvm use 18
            - node -v && npm -v
            - echo "PWD=$(pwd)" && ls -la
            # ưu tiên ci; nếu ci lỗi (vì lý do khác), fallback sang install để không kẹt pipeline
            - if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
        build:
          commands:
            - npm run build || (echo "Build failed – dumping npm logs" && mkdir -p npm-logs && (ls -la ~/.npm/_logs || true) && (for f in ~/.npm/_logs/*-debug-*.log; do echo "----- $f -----"; cat "$f" | tee -a npm-logs/combined.log; done || true) && exit 1)
            - echo "Checking output dirs..." && for d in build dist out; do echo "--- $d ---"; [ -d "$d" ] && (ls -la "$d" | head -n 50) || echo "missing: $d"; done
      artifacts:
        # CRA: build | Vite: dist | Next export: out  (đổi cho đúng)
        baseDirectory: build
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
